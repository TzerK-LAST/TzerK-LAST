<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" width="900" height="470" role="img" aria-label="Meikuto — Full Stack Developer">
  <defs>
    <clipPath id="panel">
      <rect x="1" y="1" width="898" height="468" rx="14"/>
    </clipPath>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
      .twinkle { animation: tw 3.4s ease-in-out infinite; }
      .t2 { animation-delay: .7s }  .t3 { animation-delay: 1.4s }
      .t4 { animation-delay: 2.1s }  .t5 { animation-delay: 2.8s }
      @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.9 } }
      @media (prefers-reduced-motion: reduce) { .twinkle { animation: none } }
    </style>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="900" height="470" fill="#0B1220"/>
    <circle cx="740" cy="380" r="300" fill="url(#glow)"/>

    <!-- ░░ barra de ventana ░░ -->
    <rect width="900" height="42" fill="#101B2E"/>
    <line x1="0" y1="42" x2="900" y2="42" stroke="#1B2A44"/>
    <circle cx="26" cy="21" r="5.5" fill="#1F6FEB"/>
    <circle cx="46" cy="21" r="5.5" fill="#58A6FF"/>
    <circle cx="66" cy="21" r="5.5" fill="#A5D6FF"/>
    <text class="mono" x="450" y="26" font-size="12" fill="#5F7A9E" text-anchor="middle">github / TzerK-LAST</text>

    <!-- ░░ dibujitos ░░ -->
    <g stroke="#1F6FEB" fill="none" stroke-linecap="round">
      <!-- planeta -->
      <circle cx="780" cy="400" r="90" stroke-opacity=".22"/>
      <circle cx="780" cy="400" r="90" fill="#58A6FF" fill-opacity=".03" stroke="none"/>
      <path d="M 700 360 Q 780 395 858 358" stroke-opacity=".13"/>
      <path d="M 694 420 Q 780 452 862 415" stroke-opacity=".13"/>
      <g transform="translate(780 400) rotate(-18)">
        <g transform="scale(1,0.26)">
          <circle r="145" stroke-opacity=".35" stroke-width="1.5"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
            <circle cx="145" cy="0" r="5" fill="#A5D6FF" stroke="none"/>
          </g>
        </g>
      </g>

      <!-- constelación -->
      <g stroke="#58A6FF" stroke-opacity=".38">
        <path d="M 690 96 L 742 70 L 796 106 L 832 76"/>
        <path d="M 796 106 L 772 152"/>
        <path d="M 832 76 L 862 130"/>
      </g>
      <g fill="#A5D6FF" stroke="none">
        <circle cx="690" cy="96" r="2.6"/><circle cx="742" cy="70" r="3.4"/>
        <circle cx="796" cy="106" r="2.6"/><circle cx="832" cy="76" r="3"/>
        <circle cx="862" cy="130" r="2.4"/><circle cx="772" cy="152" r="2.4"/>
      </g>

      <!-- cordón umbilical -->
      <path d="M 694 296 C 652 334, 640 392, 596 432" stroke="#1F6FEB" stroke-opacity=".3" stroke-dasharray="3 6"/>

      <!-- astronauta -->
      <g transform="translate(700 252) scale(1.35)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="7s" repeatCount="indefinite"/>
          <g stroke="#58A6FF" stroke-width="1.4">
            <rect x="7" y="26" width="6" height="15" rx="2.5" stroke-opacity=".7"/>
            <circle cx="20" cy="14" r="11.5"/>
            <ellipse cx="20" cy="14" rx="7.5" ry="6" fill="#58A6FF" fill-opacity=".14"/>
            <rect x="11" y="25" width="18" height="21" rx="6.5"/>
            <path d="M 12 30 C 4 33, 2 39, 4 44"/>
            <path d="M 29 30 C 33 24, 32 17, 27 13"/>
            <path d="M 15 46 L 13 60"/>
            <path d="M 25 46 L 28 59"/>
          </g>
        </g>
      </g>

      <!-- estrellas -->
      <g fill="#A5D6FF" stroke="none">
        <circle class="twinkle" cx="618" cy="72" r="2"/>
        <circle class="twinkle t2" cx="866" cy="228" r="1.8"/>
        <circle class="twinkle t3" cx="608" cy="196" r="1.6"/>
        <circle class="twinkle t4" cx="884" cy="322" r="2"/>
        <circle class="twinkle t5" cx="636" cy="410" r="1.7"/>
      </g>
    </g>

    <!-- ░░ identidad ░░ -->
    <text class="mono" x="40" y="88" font-size="28" fill="#58A6FF">&gt;</text>
    <text class="mono" x="70" y="88" font-size="42" font-weight="700" letter-spacing="5" fill="#E6EDF6">MEIKUTO</text>
    <rect x="296" y="56" width="15" height="38" fill="#58A6FF">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/>
    </rect>

    <text class="mono" x="40" y="118" font-size="13" fill="#58A6FF">Full Stack Developer<tspan fill="#5F7A9E">  ·  Medellín, Colombia</tspan></text>
    <text class="mono" x="40" y="140" font-size="12" fill="#5F7A9E">Laravel  ·  .NET  ·  React  ·  VS Code Extensions</text>

    <line x1="40" y1="168" x2="560" y2="168" stroke="#1B2A44"/>
    <text class="mono" x="40" y="196" font-size="10" letter-spacing="2.5" fill="#5F7A9E">STACK</text>

    <!-- ░░ pills ░░ -->
    <g class="mono" font-size="11" fill="#A5D6FF" text-anchor="middle">
      <g fill="#5F7A9E" font-size="10" text-anchor="start" fill-opacity=".85">
        <text x="40" y="220">· backend</text>
        <text x="40" y="268">· frontend</text>
        <text x="40" y="316">· data &amp; tooling</text>
      </g>
      <g fill="none" stroke="#1F6FEB" stroke-opacity=".55">
        <rect x="40"  y="226" width="65" height="22" rx="11"/>
        <rect x="113" y="226" width="45" height="22" rx="11"/>
        <rect x="166" y="226" width="65" height="22" rx="11"/>
        <rect x="239" y="226" width="38" height="22" rx="11"/>
        <rect x="285" y="226" width="31" height="22" rx="11"/>
        <rect x="40"  y="274" width="52" height="22" rx="11"/>
        <rect x="100" y="274" width="65" height="22" rx="11"/>
        <rect x="173" y="274" width="85" height="22" rx="11"/>
        <rect x="266" y="274" width="72" height="22" rx="11"/>
        <rect x="40"  y="322" width="85" height="22" rx="11"/>
        <rect x="133" y="322" width="52" height="22" rx="11"/>
        <rect x="193" y="322" width="65" height="22" rx="11"/>
        <rect x="266" y="322" width="58" height="22" rx="11"/>
        <rect x="332" y="322" width="38" height="22" rx="11"/>
        <rect x="378" y="322" width="38" height="22" rx="11"/>
      </g>
      <text x="72.5"  y="241">Laravel</text>
      <text x="135.5" y="241">.NET</text>
      <text x="198.5" y="241">Node.js</text>
      <text x="258"   y="241">PHP</text>
      <text x="300.5" y="241">C#</text>
      <text x="66"    y="289">React</text>
      <text x="132.5" y="289">Angular</text>
      <text x="215.5" y="289">JavaScript</text>
      <text x="302"   y="289">Tailwind</text>
      <text x="82.5"  y="337">PostgreSQL</text>
      <text x="159"   y="337">MySQL</text>
      <text x="225.5" y="337">MongoDB</text>
      <text x="295"   y="337">Docker</text>
      <text x="351"   y="337">Git</text>
      <text x="397"   y="337">AWS</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="469" rx="14" fill="none" stroke="#1B2A44"/>
</svg>
