<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Stack de Meikuto">
  <defs>
    <clipPath id="topRule"><rect x="0" y="0" width="900" height="3"/></clipPath>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#A855F7" stop-opacity="0"/>
      <stop class="sw" offset="50%" stop-color="#E9D5FF" stop-opacity=".95"/>
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0"/>
    </linearGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
      @keyframes af { 0%,100%{fill:#A855F7} 50%{fill:#58A6FF} }
      @keyframes lf { 0%,100%{fill:#6B5B8A} 50%{fill:#5A7599} }
      @keyframes vf { 0%,100%{fill:#E9E4F5} 50%{fill:#E4EDF7} }
      @keyframes df { 0%,100%{fill:#6D28D9} 50%{fill:#2454C7} }
      @keyframes hs { 0%,100%{stroke:#241A3D} 50%{stroke:#152541} }
      @keyframes bg { 0%,100%{fill:#06040D}  50%{fill:#04070F} }
      @keyframes sw { 0%,100%{stop-color:#E9D5FF} 50%{stop-color:#D6E8FF} }
      .af{animation:af 14s ease-in-out infinite} .lf{animation:lf 14s ease-in-out infinite}
      .vf{animation:vf 14s ease-in-out infinite} .df{animation:df 14s ease-in-out infinite}
      .hs{animation:hs 14s ease-in-out infinite} .bgf{animation:bg 14s ease-in-out infinite}
      .sw{animation:sw 14s ease-in-out infinite}
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <rect class="bgf" width="900" height="400" fill="#06040D"/>

  <!-- barrido -->
  <rect class="af" width="900" height="3" fill="#A855F7" fill-opacity=".35"/>
  <g clip-path="url(#topRule)">
    <rect width="220" height="3" fill="url(#sweep)">
      <animateTransform attributeName="transform" type="translate" from="-220 0" to="900 0" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g class="mono">
    <!-- fila 1 -->
    <text class="lf" x="40" y="62" font-size="10" letter-spacing="3" fill="#6B5B8A">BACKEND</text>
    <text class="vf" x="220" y="63" font-size="15" letter-spacing="0.5" fill="#E9E4F5">Laravel<tspan class="df" fill="#6D28D9">   ·   </tspan>.NET<tspan class="df" fill="#6D28D9">   ·   </tspan>Node.js<tspan class="df" fill="#6D28D9">   ·   </tspan>PHP<tspan class="df" fill="#6D28D9">   ·   </tspan>C#</text>
    <line class="hs" x1="40" y1="88" x2="860" y2="88" stroke="#241A3D"/>

    <!-- fila 2 -->
    <text class="lf" x="40" y="126" font-size="10" letter-spacing="3" fill="#6B5B8A">FRONTEND</text>
    <text class="vf" x="220" y="127" font-size="15" letter-spacing="0.5" fill="#E9E4F5">React<tspan class="df" fill="#6D28D9">   ·   </tspan>Angular<tspan class="df" fill="#6D28D9">   ·   </tspan>JavaScript<tspan class="df" fill="#6D28D9">   ·   </tspan>Tailwind</text>
    <line class="hs" x1="40" y1="152" x2="860" y2="152" stroke="#241A3D"/>

    <!-- fila 3 -->
    <text class="lf" x="40" y="190" font-size="10" letter-spacing="3" fill="#6B5B8A">TOOLING</text>
    <text class="vf" x="220" y="191" font-size="15" letter-spacing="0.5" fill="#E9E4F5">PostgreSQL<tspan class="df" fill="#6D28D9">   ·   </tspan>MySQL<tspan class="df" fill="#6D28D9">   ·   </tspan>Docker<tspan class="df" fill="#6D28D9">   ·   </tspan>Git</text>
    <line class="hs" x1="40" y1="216" x2="860" y2="216" stroke="#241A3D"/>

    <!-- fila 4 -->
    <text class="lf" x="40" y="254" font-size="10" letter-spacing="3" fill="#6B5B8A">BUILDING</text>
    <text class="vf" x="220" y="255" font-size="15" letter-spacing="0.5" fill="#E9E4F5">Web applications<tspan class="df" fill="#6D28D9">   ·   </tspan>REST APIs<tspan class="df" fill="#6D28D9">   ·   </tspan>VS Code extensions</text>
    <line class="hs" x1="40" y1="280" x2="860" y2="280" stroke="#241A3D"/>

    <!-- pie -->
    <text class="lf" x="40" y="312" font-size="11" fill="#6B5B8A">~/meikuto</text>
    <rect class="af" x="112" y="302" width="8" height="13" fill="#A855F7">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/>
    </rect>
    <text class="lf" x="860" y="312" font-size="10" letter-spacing="2.5" fill="#6B5B8A" text-anchor="end">MEDELLÍN · COLOMBIA</text>
    <line class="hs" x1="40" y1="336" x2="860" y2="336" stroke="#241A3D"/>
    <text class="lf" x="40" y="372" font-size="10" letter-spacing="3" fill="#6B5B8A">CONTRIBUTIONS</text>
    <text class="lf" x="860" y="372" font-size="10" letter-spacing="3" fill="#6B5B8A" text-anchor="end">LAST 12 MONTHS</text>
  </g>

  <rect class="af" y="397" width="900" height="3" fill="#A855F7" fill-opacity=".35"/>
</svg>
