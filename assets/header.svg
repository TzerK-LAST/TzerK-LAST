<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Stack de Meikuto">
  <defs>
    <clipPath id="panel"><rect x="1" y="1" width="898" height="328" rx="14"/></clipPath>
    <radialGradient id="glow" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#1F6FEB" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <style>
      .mono { font-family: 'JetBrains Mono','SFMono-Regular','SF Mono',Menlo,Consolas,'Liberation Mono',monospace; }
      .tw { animation: tw 3.4s ease-in-out infinite; }
      .d2 { animation-delay:.7s } .d3 { animation-delay:1.4s } .d4 { animation-delay:2.1s } .d5 { animation-delay:2.8s }
      @keyframes tw { 0%,100% { opacity:.15 } 50% { opacity:.9 } }
      @media (prefers-reduced-motion: reduce) { .tw { animation: none } }
    </style>
  </defs>

  <g clip-path="url(#panel)">
    <rect width="900" height="330" fill="#0B1220"/>
    <circle cx="800" cy="300" r="280" fill="url(#glow)"/>

    <rect width="900" height="42" fill="#101B2E"/>
    <line x1="0" y1="42" x2="900" y2="42" stroke="#1B2A44"/>
    <circle cx="26" cy="21" r="5.5" fill="#1F6FEB"/>
    <circle cx="46" cy="21" r="5.5" fill="#58A6FF"/>
    <circle cx="66" cy="21" r="5.5" fill="#A5D6FF"/>
    <text class="mono" x="450" y="26" font-size="12" fill="#5F7A9E" text-anchor="middle">github / TzerK-LAST</text>

    <!-- ░░ dibujitos ░░ -->
    <g fill="none" stroke-linecap="round">
      <circle cx="812" cy="308" r="85" stroke="#1F6FEB" stroke-opacity=".22"/>
      <circle cx="812" cy="308" r="85" fill="#58A6FF" fill-opacity=".03" stroke="none"/>
      <path d="M 738 272 Q 812 305 886 270" stroke="#1F6FEB" stroke-opacity=".13"/>
      <g transform="translate(812 308) rotate(-18)">
        <g transform="scale(1,0.26)">
          <circle r="132" fill="none" stroke="#1F6FEB" stroke-opacity=".35" stroke-width="1.5"/>
          <g>
            <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="34s" repeatCount="indefinite"/>
            <circle cx="132" cy="0" r="5" fill="#A5D6FF"/>
          </g>
        </g>
      </g>

      <g stroke="#58A6FF" stroke-opacity=".38">
        <path d="M 664 92 L 716 66 L 770 102 L 806 72"/>
        <path d="M 770 102 L 748 146"/>
        <path d="M 806 72 L 858 118"/>
      </g>
      <g fill="#A5D6FF" stroke="none">
        <circle cx="664" cy="92" r="2.6"/><circle cx="716" cy="66" r="3.4"/>
        <circle cx="770" cy="102" r="2.6"/><circle cx="806" cy="72" r="3"/>
        <circle cx="858" cy="118" r="2.4"/><circle cx="748" cy="146" r="2.4"/>
      </g>

      <path d="M 682 218 C 648 246, 636 282, 600 306" stroke="#1F6FEB" stroke-opacity=".3" stroke-dasharray="3 6"/>

      <g transform="translate(688 152) scale(1.3)">
        <g>
          <animateTransform attributeName="transform" type="translate" values="0 0; 0 -7; 0 0" dur="7s" repeatCount="indefinite"/>
          <g stroke="#58A6FF" stroke-width="1.4">
            <rect x="7" y="26" width="6" height="15" rx="2.5" stroke-opacity=".7"/>
            <circle cx="20" cy="14" r="11.5"/>
            <ellipse cx="20" cy="14" rx="7.5" ry="6" fill="#58A6FF" fill-opacity=".14"/>
            <rect x="11" y="25" width="18" height="21" rx="6.5"/>
            <path d="M 12 30 C 4 33, 2 39, 4 44"/>
            <path d="M 29 30 C 33 24, 32 17, 27 13"/>
            <path d="M 15 46 L 13 60"/>
            <path d="M 25 46 L 28 59"/>
          </g>
        </g>
      </g>

      <g fill="#A5D6FF" stroke="none">
        <circle class="tw" cx="612" cy="72" r="2"/>
        <circle class="tw d2" cx="874" cy="196" r="1.8"/>
        <circle class="tw d3" cx="604" cy="188" r="1.6"/>
        <circle class="tw d4" cx="640" cy="286" r="2"/>
        <circle class="tw d5" cx="890" cy="252" r="1.7"/>
      </g>
    </g>

    <!-- ░░ prompt ░░ -->
    <text class="mono" x="40" y="82" font-size="16" fill="#5F7A9E">~/meikuto</text>
    <text class="mono" x="138" y="82" font-size="16" fill="#58A6FF">&gt;</text>
    <text class="mono" x="158" y="82" font-size="16" fill="#E6EDF6">stack</text>
    <rect x="214" y="67" width="10" height="19" fill="#58A6FF">
      <animate attributeName="opacity" values="1;1;0;0" dur="1.15s" repeatCount="indefinite"/>
    </rect>

    <!-- ░░ pills ░░ -->
    <g class="mono" font-size="11" fill="#A5D6FF" text-anchor="middle">
      <g fill="#5F7A9E" font-size="10" text-anchor="start" fill-opacity=".85">
        <text x="40" y="126">· backend</text>
        <text x="40" y="174">· frontend</text>
        <text x="40" y="222">· data &amp; tooling</text>
      </g>
      <g fill="none" stroke="#1F6FEB" stroke-opacity=".55">
        <rect x="40"  y="132" width="65" height="22" rx="11"/>
        <rect x="113" y="132" width="45" height="22" rx="11"/>
        <rect x="166" y="132" width="65" height="22" rx="11"/>
        <rect x="239" y="132" width="38" height="22" rx="11"/>
        <rect x="285" y="132" width="31" height="22" rx="11"/>
        <rect x="40"  y="180" width="52" height="22" rx="11"/>
        <rect x="100" y="180" width="65" height="22" rx="11"/>
        <rect x="173" y="180" width="85" height="22" rx="11"/>
        <rect x="266" y="180" width="72" height="22" rx="11"/>
        <rect x="40"  y="228" width="85" height="22" rx="11"/>
        <rect x="133" y="228" width="52" height="22" rx="11"/>
        <rect x="193" y="228" width="65" height="22" rx="11"/>
        <rect x="266" y="228" width="58" height="22" rx="11"/>
        <rect x="332" y="228" width="38" height="22" rx="11"/>
        <rect x="378" y="228" width="38" height="22" rx="11"/>
      </g>
      <text x="72.5"  y="147">Laravel</text>
      <text x="135.5" y="147">.NET</text>
      <text x="198.5" y="147">Node.js</text>
      <text x="258"   y="147">PHP</text>
      <text x="300.5" y="147">C#</text>
      <text x="66"    y="195">React</text>
      <text x="132.5" y="195">Angular</text>
      <text x="215.5" y="195">JavaScript</text>
      <text x="302"   y="195">Tailwind</text>
      <text x="82.5"  y="243">PostgreSQL</text>
      <text x="159"   y="243">MySQL</text>
      <text x="225.5" y="243">MongoDB</text>
      <text x="295"   y="243">Docker</text>
      <text x="351"   y="243">Git</text>
      <text x="397"   y="243">AWS</text>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="899" height="329" rx="14" fill="none" stroke="#1B2A44"/>
</svg>
